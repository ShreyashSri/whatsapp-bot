name: Diagnose Bot

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check process and logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 2m
          script: |
            set +e
            cd ~/whatsapp-bot
            
            echo "=== BOT PROCESS STATUS ==="
            if pgrep -f "venv/bin/python bot.py" > /dev/null; then
              echo "✅ Bot is currently RUNNING"
              ps -p $(pgrep -f "venv/bin/python bot.py") -o pid,etime,%cpu,%mem,cmd
            else
              echo "❌ Bot is NOT running!"
            fi
            
            echo
            echo "=== RECENT LOGS (bot.log) ==="
            tail -n 50 bot.log
