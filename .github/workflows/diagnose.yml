name: Diagnose PBBot

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 2m
          script: |
            set +e
            echo "=== PBBot containers ==="
            docker ps --filter name=pbbot
            echo
            echo "=== PBBot logs ==="
            docker logs --tail 200 pbbot
            echo
            echo "=== PBBot health ==="
            curl -fsS http://localhost:3000/health
            echo
            echo "=== OpenWA dependency health ==="
            curl -fsS http://localhost:3000/health/openwa
