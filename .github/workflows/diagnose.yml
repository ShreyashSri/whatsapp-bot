name: Diagnose Bot

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: PM2 status + recent logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 2m
          script: |
            # Load user profile so npx is in PATH
            source ~/.profile || source ~/.bashrc || source ~/.zshrc || true
            
            set +e
            cd ~/whatsapp-bot
            echo "=== PM2 list ==="
            npx pm2 list
            echo
            echo "=== PM2 info ==="
            npx pm2 info whatsapp-bot
            echo
            echo "=== PM2 logs (Last 50 lines) ==="
            npx pm2 logs whatsapp-bot --lines 50 --nostream
