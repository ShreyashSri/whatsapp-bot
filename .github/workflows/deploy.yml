name: Deploy WhatsApp Bot

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build, Push & Update Infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "env=prod" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            shreyashsri/whatsapp-bot:${{ steps.meta.outputs.env }}
            shreyashsri/whatsapp-bot:${{ steps.meta.outputs.env }}-${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update manifest in infra repo
        env:
          PAT: ${{ secrets.INFRA_PAT }}
        run: |
          ENV="${{ steps.meta.outputs.env }}"
          IMAGE_TAG="${ENV}-${{ steps.meta.outputs.sha_short }}"
          git clone https://${PAT}@github.com/pointblank-club/infra.git infra
          cd infra
          sed -i "s|image: shreyashsri/whatsapp-bot:.*|image: shreyashsri/whatsapp-bot:${IMAGE_TAG}|" \
            argocd/whatsapp-bot/statefulset.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add argocd/whatsapp-bot/statefulset.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(${ENV}): update whatsapp-bot image to ${IMAGE_TAG}"
          git push
