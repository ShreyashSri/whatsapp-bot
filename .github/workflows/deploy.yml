name: Deploy WhatsApp Bot

on:
  push:
    branches: [main]

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            shreyashsri/whatsapp-bot:latest
            shreyashsri/whatsapp-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-infra:
    name: Update k8s manifest in infra repo
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Update image tag and push
        env:
          PAT: ${{ secrets.INFRA_PAT }}
        run: |
          IMAGE_TAG="${{ github.sha }}"
          git clone https://x-access-token:${PAT}@github.com/pointblank-club/infra.git infra
          cd infra
          sed -i "s|image: shreyashsri/whatsapp-bot:.*|image: shreyashsri/whatsapp-bot:${IMAGE_TAG}|" \
            argocd/whatsapp-bot/statefulset.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add argocd/whatsapp-bot/statefulset.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(whatsapp-bot): update image to ${IMAGE_TAG}"
          git push

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 30s
          source: "bot.py,requirements.txt,features,cards,db,updates,migrations"
          target: ~/whatsapp-bot

      - name: Install deps and restart bot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            cd ~/whatsapp-bot
            venv/bin/pip install -r requirements.txt
            npx pm2 restart whatsapp-bot
