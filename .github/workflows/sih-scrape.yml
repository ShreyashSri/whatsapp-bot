name: SIH 2026 scrape

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper deps
        run: |
          python -m pip install -U pip
          pip install httpx beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Scrape and post to bot
        env:
          SIH_INGEST_URL: ${{ secrets.SIH_INGEST_URL }}
          SIH_INGEST_SECRET: ${{ secrets.SIH_INGEST_SECRET }}
          SIH_PS_URL: ${{ vars.SIH_PS_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          : "${SIH_INGEST_URL:?Configure the SIH_INGEST_URL repository secret}"
          : "${SIH_INGEST_SECRET:?Configure the SIH_INGEST_SECRET repository secret}"
          python -m scripts.sih_scrape \
            --url "${SIH_PS_URL:-https://sih.gov.in/sih2026PS}" \
            --post "$SIH_INGEST_URL" \
            --secret "$SIH_INGEST_SECRET"
